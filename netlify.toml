# Must live at the repo root — Netlify reads its config from there, not from the
# app subdirectory. `base` moves the build into frontend/, and `publish` is then
# resolved relative to that base.
[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_API_URL is set in the Netlify dashboard (Site settings > Environment
  # variables) and must point at the deployed Vercel API, e.g.
  #   https://your-api.vercel.app/api

# SPA history fallback — deep links must reach index.html, not a 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# Hashed assets are content-addressed, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
