# Hospital Core — local development stack.
#
#   docker compose up --build      brings up mongo + core API + booking service + UI
#   docker compose run --rm seed   fills the database with mock clinical data
#
# All four services join one private bridge network. Only the UI (5173) and the
# API ports are published to the host; Mongo is reachable by service name only,
# which mirrors the private-subnet boundary described in infra/docs/vpc-blueprint.md.

services:
  mongo:
    image: mongo:7
    container_name: hospital-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hospital
    volumes:
      - mongo-data:/data/db
    networks: [hospital-net]
    # Published only so you can inspect the DB with Compass during development.
    # Remove this block to make the database strictly cluster-internal.
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hospital-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/hospital
      APPOINTMENT_SERVICE_URL: http://appointment-service:5001
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - '5000:5000'
    volumes:
      # Source is bind-mounted for hot reload; the anonymous volume keeps the
      # container's own node_modules from being shadowed by the host directory.
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks: [hospital-net]

  appointment-service:
    build:
      context: ./services/appointment-service
      dockerfile: Dockerfile
    container_name: hospital-appointments
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/hospital
      CORE_API_URL: http://backend:5000/api
    ports:
      - '5001:5001'
    depends_on:
      mongo:
        condition: service_healthy
    networks: [hospital-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hospital-frontend
    restart: unless-stopped
    environment:
      # Vite proxies /api to the backend service inside the compose network.
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks: [hospital-net]

  # One-shot seeding job. Not started by `up` — run it explicitly:
  #   docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hospital-seed
    profiles: ['tools']
    environment:
      MONGO_URI: mongodb://mongo:27017/hospital
    command: ['node', 'seed.js']
    depends_on:
      mongo:
        condition: service_healthy
    networks: [hospital-net]

networks:
  hospital-net:
    driver: bridge

volumes:
  mongo-data:
