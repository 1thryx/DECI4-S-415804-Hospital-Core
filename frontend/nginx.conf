server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached or users
    # get pinned to a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Proxy the API so the browser sees one origin — no CORS preflight in the
    # container topology, matching how the k8s ingress routes /api.
    #
    # The upstream is the Kubernetes Service name, because this file ships only in
    # the production image (frontend/Dockerfile), which is deployed to the cluster.
    # Compose builds Dockerfile.dev instead and proxies through Vite's dev server
    # via VITE_PROXY_TARGET, so it never reads this config. nginx resolves upstream
    # hostnames once at startup and exits if resolution fails, so this name has to
    # match the environment the image actually runs in.
    location /api/ {
        proxy_pass http://backend-service:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback: deep links resolve to the client router, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
