# Enforces the public/private split from the VPC blueprint at the pod level:
# only application-tier pods may open connections to the data tier. Without this,
# any compromised pod in the namespace could read the patient database directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-private-tier
  namespace: hospital
spec:
  podSelector:
    matchLabels:
      tier: data
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: application
      ports:
        - protocol: TCP
          port: 27017
---
# The presentation tier talks to the API and nothing else — it has no business
# holding a database connection.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: hospital
spec:
  podSelector:
    matchLabels:
      tier: presentation
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: application
      ports:
        - protocol: TCP
          port: 5000
    # DNS resolution must stay open or service names stop resolving.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
