apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hospital
  labels:
    app: backend
    tier: application
spec:
  # The Deployment manages a ReplicaSet; this is the floor the HPA scales up from.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime rollouts — the clinic never loses the API
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
        - name: backend
          image: hospital-core/backend:latest
          # Minikube builds images into its own daemon (eval $(minikube docker-env));
          # Never means the kubelet uses that local image instead of hitting a registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: hospital-db-secret
                  key: MONGO_URI
          envFrom:
            - configMapRef:
                name: hospital-config
          # Requests must be set for the HPA to have a CPU percentage to scale against.
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            # /api/health returns 503 until Mongo is connected, so a pod is kept out
            # of the Service until it can actually serve clinical queries.
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: hospital
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      name: http
---
# Horizontal Pod Autoscaler — replicates backend pods under load, which is the
# "ReplicaSets that scale automatically under high load" requirement.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: hospital
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # Surge fast: a ward filling up is exactly when latency matters most.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Retreat slowly so a brief lull doesn't cause thrash.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
