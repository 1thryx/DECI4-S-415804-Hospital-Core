# MongoDB runs as a StatefulSet: clinical data needs stable storage and a stable
# network identity, neither of which a Deployment guarantees.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: hospital
spec:
  serviceName: mongo-service
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        tier: data
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          livenessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mongo-storage
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
---
# Headless service — the database is addressable only inside the cluster. There is
# deliberately no NodePort or Ingress path pointing here: this is the private tier.
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: hospital
spec:
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
