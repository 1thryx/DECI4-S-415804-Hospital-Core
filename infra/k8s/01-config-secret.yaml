apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-config
  namespace: hospital
data:
  NODE_ENV: 'production'
  BACKEND_PORT: '5000'
  APPOINTMENT_SERVICE_URL: 'http://appointment-service:5001'
  CORE_API_URL: 'http://backend-service:5000/api'
  CORS_ORIGINS: 'http://hospital.local,https://hospital.local'
---
# Demo credentials for a local Minikube cluster only. In a real cluster this
# object is created out-of-band (sealed-secrets / External Secrets / cloud KMS)
# and never committed — Secret data is base64, which is encoding, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: hospital-db-secret
  namespace: hospital
type: Opaque
stringData:
  # In-cluster MongoDB for local runs. Swap for the Atlas SRV string in production.
  MONGO_URI: 'mongodb://mongo-service:27017/hospital'
